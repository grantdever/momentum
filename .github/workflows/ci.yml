name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No dependencies to install — the pure modules run on plain Node.
      - run: npm test
        env:
          # Maintainer-specific privacy guard terms (comma-separated repo
          # secret; empty on forks, where only the generic markers are checked).
          PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}
